[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brazil-electoral-abstention-spatial"
version = "0.1.0"
description = "Research scaffold for Brazilian electoral abstention and spatial econometrics"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "geopandas>=0.14",
  "libpysal>=4.9",
  "esda>=2.5",
  "spreg>=1.4"
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "jupyterlab>=4.0", "ipykernel>=6.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
